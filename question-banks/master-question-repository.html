document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<title>DA / DE - Master question repository<\/title>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"3109f9c4-c013-4da0-a0c1-c850c3dee430\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n:root{\n--paper:#FBFAF6; --panel:#FFFFFF; --ink:#16181C; --ink-2:#5A6068; --ink-3:#8A9099;\n--rule:#C3CFD8; --grid:#D8E4EC; --blue:#1F4E79; --blue-wash:#E8F0F6; --amber:#9A6A05;\n--amber-wash:#FBF1DC; --green:#2C6E49; --green-wash:#E6F1EA; --red:#9B3226; --red-wash:#F7E9E7;\n}\n@media (prefers-color-scheme: dark){\n:root{\n--paper:#12151A; --panel:#171B21; --ink:#E8EAED; --ink-2:#9BA3AC; --ink-3:#6C747D;\n--rule:#2A333D; --grid:#1E252D; --blue:#79ACD6; --blue-wash:#16232F; --amber:#D9A441;\n--amber-wash:#241D0F; --green:#7FBF9A; --green-wash:#122019; --red:#D98A7E; --red-wash:#241512;\n}\n}\nhtml,body{margin:0;padding:0;}\nbody{\nbackground-color:var(--paper);\nbackground-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\nbackground-size:22px 22px;\ncolor:var(--ink);\nfont-family:\"IBM Plex Sans\",\"Segoe UI\",system-ui,sans-serif;\n-webkit-text-size-adjust:100%;\noverflow-x:hidden;\n}\n*{box-sizing:border-box;}\na{color:var(--blue);}\na:hover{color:var(--ink);}\ninput,button,textarea{font-family:inherit;}\ninput::placeholder{color:var(--ink-3);}\ncode,pre{font-family:\"IBM Plex Mono\",ui-monospace,Consolas,monospace;}\n<\u002Fstyle>\n<script src=\"695674f5-fa9f-465c-beb3-4115e0afbc2b\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div style=\"max-width:1060px;margin:0 auto;padding:20px 16px 120px;\">\n\n<a href=\"../index.html\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.06em;color:var(--ink-3);text-decoration:none;display:inline-block;margin-bottom:26px;\">← Interview Prep home<\u002Fa>\n\n<div style=\"border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:18px;\">\n<div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--blue);margin-bottom:10px;\">Question bank / DA + DE<\u002Fdiv>\n<h1 style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:30px;line-height:1.15;font-weight:600;margin:0 0 8px;letter-spacing:-0.01em;color:var(--ink);\">Master Question Repository<\u002Fh1>\n<p style=\"margin:0;font-size:14px;line-height:1.55;color:var(--ink-2);max-width:60ch;text-wrap:pretty;\">Active recall drill for the Data Analyst / Data Engineer surface. Click a card to reveal the notes, then mark yourself honestly. <span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;color:var(--ink-3);\">{{ total }} questions<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;margin-bottom:14px;\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:10px;\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-right:auto;\">Overall progress<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--green);\">{{ knownCount }} known<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--amber);\">{{ needsCount }} needs work<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-3);\">{{ untouchedCount }} untouched<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;height:8px;background:var(--grid);border-radius:1px;overflow:hidden;\">\n    <div style=\"background:var(--green);width:{{ pctKnown }};transition:width .2s;\"><\u002Fdiv>\n    <div style=\"background:var(--amber);width:{{ pctNeeds }};transition:width .2s;\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;\">\n    <button sc-camel-on-click=\"{{ onOpenTest }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:0.04em;color:var(--paper);background:var(--blue);border:1px solid var(--blue);border-radius:2px;padding:7px 13px;cursor:pointer;\">▶ Self-test — the 25 that matter most<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onExpandAll }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:7px 13px;cursor:pointer;\">{{ expandLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ onReset }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--red);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:7px 13px;cursor:pointer;margin-left:auto;\">Reset progress<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position:sticky;top:0;z-index:30;background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:12px 14px;margin-bottom:22px;box-shadow:0 6px 14px -12px rgba(0,0,0,.5);\">\n  <input value=\"{{ search }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search question text or ID (e.g. SQL-WIN-05, sessionization)\" style=\"width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:9px 11px;font-size:13px;outline:none;margin-bottom:10px;\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px;\">\n    <sc-for list=\"{{ domainChips }}\" as=\"c\" hint-placeholder-count=\"8\">\n      <sc-if value=\"{{ c.on }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ c.toggle }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.03em;color:var(--paper);background:var(--blue);border:1px solid var(--blue);border-radius:2px;padding:4px 8px;cursor:pointer;\">{{ c.label }}<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ c.off }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ c.toggle }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.03em;color:var(--ink-2);background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:4px 8px;cursor:pointer;\">{{ c.label }}<\u002Fbutton><\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:5px;\">\n    <sc-for list=\"{{ modeChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <sc-if value=\"{{ c.on }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ c.toggle }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.03em;color:var(--paper);background:var(--ink-2);border:1px solid var(--ink-2);border-radius:2px;padding:4px 8px;cursor:pointer;\">{{ c.label }}<\u002Fbutton><\u002Fsc-if>\n      <sc-if value=\"{{ c.off }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ c.toggle }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.03em;color:var(--ink-2);background:var(--panel);border:1px dashed var(--rule);border-radius:2px;padding:4px 8px;cursor:pointer;\">{{ c.label }}<\u002Fbutton><\u002Fsc-if>\n    <\u002Fsc-for>\n    <div style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-3);align-self:center;\">{{ matchLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"4\">\n<sc-if value=\"{{ d.visible }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-bottom:14px;border:1px solid var(--rule);border-radius:2px;background:var(--panel);\">\n  <div sc-camel-on-click=\"{{ d.toggle }}\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:13px 15px;cursor:pointer;border-bottom:1px solid var(--grid);\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-3);width:14px;\">{{ d.caret }}<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink);font-weight:600;\">{{ d.title }}<\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-3);\">{{ d.countLabel }}<\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:10px;\">\n      <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-3);\">{{ d.progLabel }}<\u002Fdiv>\n      <div style=\"display:flex;width:120px;height:6px;background:var(--grid);border-radius:1px;overflow:hidden;\">\n        <div style=\"background:var(--green);width:{{ d.pctKnown }};\"><\u002Fdiv>\n        <div style=\"background:var(--amber);width:{{ d.pctNeeds }};\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ d.open }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px;\">\n    <sc-for list=\"{{ d.notes }}\" as=\"n\" hint-placeholder-count=\"0\">\n      <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ n.html }}\" style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2);background:var(--blue-wash);border-left:2px solid var(--blue);padding:9px 12px;border-radius:2px;\"><\u002Fdiv>\n    <\u002Fsc-for>\n    <sc-for list=\"{{ d.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <sc-if value=\"{{ it.newConcept }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 2px 2px;border-top:1px solid var(--grid);\">{{ it.concept }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"border:1px solid var(--rule);border-radius:2px;background:var(--panel);overflow:hidden;\">\n        <div sc-camel-on-click=\"{{ it.toggle }}\" style=\"display:flex;gap:11px;padding:11px 13px;cursor:pointer;align-items:flex-start;\">\n          <div style=\"width:3px;align-self:stretch;background:{{ it.accent }};border-radius:2px;flex:none;\"><\u002Fdiv>\n          <div style=\"flex:1;min-width:0;\">\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:5px;\">\n              <span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.04em;color:var(--blue);background:var(--blue-wash);padding:2px 6px;border-radius:2px;\">{{ it.id }}<\u002Fspan>\n              <sc-if value=\"{{ it.hasStars }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--amber);letter-spacing:0.05em;\">{{ it.stars }}<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ it.hasWeight }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:0.06em;color:var(--ink-2);border:1px solid var(--rule);padding:1px 5px;border-radius:2px;\">{{ it.weight }}<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ it.isKnown }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--green);background:var(--green-wash);padding:2px 6px;border-radius:2px;\">Known<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ it.isNeeds }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-wash);padding:2px 6px;border-radius:2px;\">Needs work<\u002Fspan><\u002Fsc-if>\n              <span style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:10px;color:var(--ink-3);\">{{ it.hint }}<\u002Fspan>\n            <\u002Fdiv>\n            <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.qHtml }}\" style=\"font-size:14px;line-height:1.55;color:var(--ink);text-wrap:pretty;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ it.revealed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-top:1px dashed var(--rule);padding:12px 13px 11px 27px;\">\n          <sc-if value=\"{{ it.hasAnswer }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.aHtml }}\" style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2);text-wrap:pretty;\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ it.noAnswer }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;line-height:1.6;color:var(--ink-3);font-style:italic;\">No notes — answer this out loud.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ it.hasCode }}\" hint-placeholder-val=\"{{ false }}\">\n            <pre style=\"margin:10px 0 0;background:var(--grid);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;font-size:12px;line-height:1.5;color:var(--ink);overflow-x:auto;white-space:pre;\">{{ it.code }}<\u002Fpre>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;\">\n            <button sc-camel-on-click=\"{{ it.markKnown }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11.5px;letter-spacing:0.03em;color:var(--green);background:var(--green-wash);border:1px solid var(--green);border-radius:2px;padding:6px 11px;cursor:pointer;\">✓ I know this<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ it.markNeeds }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11.5px;letter-spacing:0.03em;color:var(--amber);background:var(--amber-wash);border:1px solid var(--amber);border-radius:2px;padding:6px 11px;cursor:pointer;\">↻ Needs work<\u002Fbutton>\n            <sc-if value=\"{{ it.hasStatus }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ it.markClear }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink-3);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:6px 11px;cursor:pointer;\">Clear<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-for>\n\n<sc-if value=\"{{ noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"border:1px dashed var(--rule);border-radius:2px;padding:34px;text-align:center;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-3);\">No questions match those filters.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:34px;border-top:1px solid var(--rule);padding-top:18px;\">\n  <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;\">Part 15 — deliberate scope boundaries<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:7px;\">\n    <sc-for list=\"{{ scope }}\" as=\"s\" hint-placeholder-count=\"7\">\n      <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ s.html }}\" style=\"font-size:12.5px;line-height:1.6;color:var(--ink-2);text-wrap:pretty;\"><\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<sc-if value=\"{{ testOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:100;background:var(--paper);overflow-y:auto;padding:18px 14px 60px;\">\n  <div style=\"max-width:760px;margin:0 auto;\">\n    <div style=\"display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:18px;\">\n      <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--blue);\">Self-test / 25 that matter most<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onCloseTest }}\" style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:6px 11px;cursor:pointer;\">Exit<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ testIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:20px;\">\n        <h2 style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:20px;font-weight:600;margin:0 0 10px;color:var(--ink);\">If you can't do these cold, you're not ready.<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:13.5px;line-height:1.6;color:var(--ink-2);\">25 questions, one at a time, each with its target time counting down. Mark yourself pass or fail. Anything you fail gets flagged \"needs work\" back in the explorer.<\u002Fp>\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;\">Scoring<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:20px;\">\n          <div style=\"font-size:13px;line-height:1.5;color:var(--green);background:var(--green-wash);padding:8px 11px;border-radius:2px;\">22+ clean = ready.<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--amber);background:var(--amber-wash);padding:8px 11px;border-radius:2px;\">15–21 = drill the misses for a week.<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--red);background:var(--red-wash);padding:8px 11px;border-radius:2px;\">Under 15 = you're preparing for the wrong interview stage; go back to fundamentals before doing mocks.<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onStartTest }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:0.04em;color:var(--paper);background:var(--blue);border:1px solid var(--blue);border-radius:2px;padding:10px 18px;cursor:pointer;\">Start the clock<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ testRunning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px;\">\n          <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-3);\">{{ tProgress }}<\u002Fdiv>\n          <div style=\"flex:1;height:4px;background:var(--grid);border-radius:1px;overflow:hidden;\"><div style=\"height:100%;background:var(--blue);width:{{ tPct }};\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:18px;\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;\">\n            <span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--blue);background:var(--blue-wash);padding:3px 7px;border-radius:2px;\">{{ tId }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-3);\">target {{ tTarget }}<\u002Fspan>\n            <sc-if value=\"{{ tOnTime }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:0.02em;\">{{ tClock }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ tOver }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:26px;font-weight:600;color:var(--red);letter-spacing:0.02em;\">{{ tClock }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;\">{{ tTask }}<\u002Fdiv>\n          <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ tQHtml }}\" style=\"font-size:17px;line-height:1.5;color:var(--ink);text-wrap:pretty;\"><\u002Fdiv>\n          <sc-if value=\"{{ tRevealed }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;border-top:1px dashed var(--rule);padding-top:12px;\">\n              <sc-if value=\"{{ tHasAnswer }}\" hint-placeholder-val=\"{{ true }}\"><div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ tAHtml }}\" style=\"font-size:13.5px;line-height:1.6;color:var(--ink-2);\"><\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ tNoAnswer }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13px;color:var(--ink-3);font-style:italic;\">No notes — answer this out loud.<\u002Fdiv><\u002Fsc-if>\n              <sc-if value=\"{{ tHasCode }}\" hint-placeholder-val=\"{{ false }}\"><pre style=\"margin:10px 0 0;background:var(--grid);border:1px solid var(--rule);border-radius:2px;padding:11px 12px;font-size:12px;line-height:1.5;color:var(--ink);overflow-x:auto;white-space:pre;\">{{ tCode }}<\u002Fpre><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;\">\n            <button sc-camel-on-click=\"{{ onReveal }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:8px 13px;cursor:pointer;\">Reveal notes<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onPass }}\" style=\"margin-left:auto;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--green);background:var(--green-wash);border:1px solid var(--green);border-radius:2px;padding:8px 15px;cursor:pointer;\">✓ Pass<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onFail }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--red);background:var(--red-wash);border:1px solid var(--red);border-radius:2px;padding:8px 15px;cursor:pointer;\">✕ Fail<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ testDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:22px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:52px;font-weight:600;color:var(--ink);line-height:1;margin-bottom:6px;\">{{ tScore }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px;\">clean out of 25<\u002Fdiv>\n        <div sc-camel-dangerously-set-inner-h-t-m-l=\"{{ tVerdictHtml }}\" style=\"font-size:15px;line-height:1.55;padding:12px 14px;border-radius:2px;background:{{ tVerdictWash }};color:{{ tVerdictInk }};margin-bottom:18px;\"><\u002Fdiv>\n        <sc-if value=\"{{ tHasMisses }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;\">Flagged needs work<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px;margin-bottom:18px;\">\n            <sc-for list=\"{{ tMisses }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-2);\">\n                <span style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:11px;color:var(--amber);background:var(--amber-wash);padding:2px 6px;border-radius:2px;\">{{ m.id }}<\u002Fspan>\n                <span>{{ m.task }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <button sc-camel-on-click=\"{{ onStartTest }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-2);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:9px 14px;cursor:pointer;\">Run it again<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onCloseTest }}\" style=\"font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:12px;color:var(--paper);background:var(--blue);border:1px solid var(--blue);border-radius:2px;padding:9px 14px;cursor:pointer;\">Back to the explorer<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:900}}\">\n\nconst KEY = 'dade-repo-v1';\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;').replace(/>/g,'&gt;');\nconst MONO = \"'IBM Plex Mono',ui-monospace,Consolas,monospace\";\nfunction md(s){\n  if(!s) return '';\n  let h = esc(s);\n  h = h.replace(/`([^`]+)`/g, '<code style=\"font-family:'+MONO+';font-size:0.92em;background:var(--blue-wash);color:var(--blue);padding:1px 4px;border-radius:2px;\">$1<\u002Fcode>');\n  h = h.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong style=\"font-weight:600;color:var(--ink);\">$1<\u002Fstrong>');\n  h = h.replace(/\\*\\(([^)]*)\\)\\*/g, '<em style=\"color:var(--ink-3);\">($1)<\u002Fem>');\n  h = h.replace(/\\*([^*]+)\\*/g, '<em style=\"color:var(--ink-3);\">$1<\u002Fem>');\n  return h;\n}\nconst html = s => ({__html: md(s)});\n\nclass Component extends DCLogic {\n  state = { ready:false, status:{}, revealed:{}, open:{}, search:'', doms:[], prios:[], weights:[],\n            needsOnly:false, test:null, tick:0 };\n\n  componentDidMount(){\n    let n=0;\n    const wait = () => {\n      if (window.DADE_QUESTIONS){ this.setState({ready:true}); }\n      else if (n++ < 200) setTimeout(wait, 25);\n    };\n    wait();\n    try { const raw = localStorage.getItem(KEY);\n      if (raw){ const o = JSON.parse(raw); if (o && o.status) this.setState({status:o.status}); } } catch(e){}\n    this._timer = setInterval(()=>{ if (this.state.test && this.state.test.phase==='run') this.setState(s=>({tick:s.tick+1})); }, 250);\n  }\n  componentWillUnmount(){ clearInterval(this._timer); }\n\n  save(status){ try { localStorage.setItem(KEY, JSON.stringify({status})); } catch(e){} }\n  setStatus(id, v){\n    this.setState(s => { const st = Object.assign({}, s.status);\n      if (v) st[id]=v; else delete st[id];\n      this.save(st); return {status:st}; });\n  }\n  toggleIn(key, v){\n    this.setState(s => { const arr = s[key].slice(); const i = arr.indexOf(v);\n      if (i>=0) arr.splice(i,1); else arr.push(v); return {[key]:arr}; });\n  }\n\n  matches(it, dTitle){\n    const s = this.state;\n    if (s.doms.length && s.doms.indexOf(dTitle)<0) return false;\n    if (s.prios.length && s.prios.indexOf(it.priority)<0) return false;\n    if (s.weights.length && s.weights.indexOf(it.weight||'-')<0) return false;\n    if (s.needsOnly && s.status[it.id]!=='needs') return false;\n    const q = s.search.trim().toLowerCase();\n    if (q){\n      const hay = (it.id+' '+it.q+' '+it.a+' '+(it.concept||'')+' '+(it.code||'')).toLowerCase();\n      if (hay.indexOf(q)<0) return false;\n    }\n    return true;\n  }\n\n  clock(sec){\n    const neg = sec<0, a = Math.abs(sec);\n    return (neg?'-':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');\n  }\n\n  startTest(){\n    const list = window.DADE_SELFTEST||[];\n    this.setState({test:{phase:'run', i:0, marks:[], start:Date.now(), revealed:false, list}});\n  }\n  mark(pass){\n    const t = this.state.test; const item = t.list[t.i];\n    if (!pass) this.setStatus(item.id, 'needs');\n    const marks = t.marks.concat([{id:item.id, task:item.task, pass}]);\n    const next = t.i+1;\n    this.setState({test: next>=t.list.length\n      ? {phase:'done', i:t.i, marks, list:t.list}\n      : {phase:'run', i:next, marks, start:Date.now(), revealed:false, list:t.list}});\n  }\n\n  renderVals(){\n    const S = this.state;\n    const DOMAINS = (S.ready && window.DADE_DOMAINS) || [];\n    const SELF = (S.ready && window.DADE_SELFTEST) || [];\n    const SCOPE = (S.ready && window.DADE_SCOPE) || [];\n    const byId = {}; DOMAINS.forEach(d=>d.items.forEach(i=>byId[i.id]=i));\n\n    const filtering = !!(S.search.trim() || S.doms.length || S.prios.length || S.weights.length || S.needsOnly);\n    let total=0, known=0, needs=0, shown=0;\n\n    const domains = DOMAINS.map(d => {\n      const all = d.items;\n      total += all.length;\n      let dk=0, dn=0;\n      all.forEach(i => { const st=S.status[i.id]; if (st==='known'){dk++;known++;} else if (st==='needs'){dn++;needs++;} });\n      const list = all.filter(i => this.matches(i, d.title));\n      shown += list.length;\n      const isOpen = S.open[d.key] !== undefined ? S.open[d.key] : (filtering && list.length>0);\n      let lastConcept = null;\n      const items = !isOpen ? [] : list.map(it => {\n        const st = S.status[it.id];\n        const newConcept = !!it.concept && it.concept !== lastConcept;\n        lastConcept = it.concept;\n        return {\n          concept: it.concept||'', newConcept,\n          id: it.id, stars: '★'.repeat(it.priority), hasStars: it.priority>0,\n          weight: it.weight||'', hasWeight: !!it.weight,\n          qHtml: html(it.q), aHtml: html(it.a),\n          hasAnswer: !!it.a, noAnswer: !it.a, hasCode: !!it.code, code: it.code,\n          revealed: !!S.revealed[it.id],\n          hint: S.revealed[it.id] ? '' : 'reveal',\n          isKnown: st==='known', isNeeds: st==='needs', hasStatus: !!st,\n          accent: st==='known' ? 'var(--green)' : st==='needs' ? 'var(--amber)' : 'var(--grid)',\n          toggle: () => this.setState(s => ({revealed: Object.assign({}, s.revealed, {[it.id]: !s.revealed[it.id]})})),\n          markKnown: (e)=>{ e.stopPropagation(); this.setStatus(it.id,'known'); },\n          markNeeds: (e)=>{ e.stopPropagation(); this.setStatus(it.id,'needs'); },\n          markClear: (e)=>{ e.stopPropagation(); this.setStatus(it.id,null); }\n        };\n      });\n      return {\n        key: d.key, title: d.title, visible: list.length>0, open: isOpen, caret: isOpen?'▾':'▸',\n        countLabel: filtering ? list.length+' / '+all.length : all.length+'',\n        progLabel: dk+'✓ '+dn+'↻',\n        pctKnown: (all.length? dk/all.length*100:0).toFixed(2)+'%',\n        pctNeeds: (all.length? dn/all.length*100:0).toFixed(2)+'%',\n        notes: isOpen ? d.notes.map(n=>({html:html(n)})) : [],\n        items,\n        toggle: () => this.setState(s => ({open: Object.assign({}, s.open, {[d.key]: !isOpen})}))\n      };\n    });\n\n    const chip = (label,on,toggle)=>({label,on,off:!on,toggle});\n    const domainChips = DOMAINS.map(d => chip(d.title, S.doms.indexOf(d.title)>=0, ()=>this.toggleIn('doms', d.title)));\n    const modeChips = [\n      chip('★★★', S.prios.indexOf(3)>=0, ()=>this.toggleIn('prios',3)),\n      chip('★★', S.prios.indexOf(2)>=0, ()=>this.toggleIn('prios',2)),\n      chip('★', S.prios.indexOf(1)>=0, ()=>this.toggleIn('prios',1)),\n      chip('Unrated', S.prios.indexOf(0)>=0, ()=>this.toggleIn('prios',0)),\n      chip('DA', S.weights.indexOf('DA')>=0, ()=>this.toggleIn('weights','DA')),\n      chip('DE', S.weights.indexOf('DE')>=0, ()=>this.toggleIn('weights','DE')),\n      chip('Needs work only', S.needsOnly, ()=>this.setState(s=>({needsOnly:!s.needsOnly})))\n    ];\n\n    const anyOpen = domains.some(d=>d.open);\n    const V = {\n      total, knownCount:known, needsCount:needs, untouchedCount: total-known-needs,\n      pctKnown: (total? known/total*100:0).toFixed(2)+'%',\n      pctNeeds: (total? needs/total*100:0).toFixed(2)+'%',\n      search: S.search,\n      onSearch: e => this.setState({search:e.target.value, open:{}}),\n      domainChips, modeChips, domains,\n      matchLabel: filtering ? shown+' of '+total+' shown' : total+' questions',\n      noMatches: S.ready && shown===0,\n      scope: SCOPE.map(s=>({html:html(s)})),\n      expandLabel: anyOpen ? 'Collapse all' : 'Expand all',\n      onExpandAll: () => { const o={}; DOMAINS.forEach(d=>o[d.key]=!anyOpen); this.setState({open:o}); },\n      onReset: () => { if (window.confirm('Clear all progress for '+total+' questions?')){ this.save({}); this.setState({status:{}}); } },\n      onOpenTest: () => this.setState({test:{phase:'intro'}}),\n      onCloseTest: () => this.setState({test:null}),\n      onStartTest: () => this.startTest(),\n      testOn: !!S.test,\n      testIntro: !!S.test && S.test.phase==='intro',\n      testRunning: !!S.test && S.test.phase==='run',\n      testDone: !!S.test && S.test.phase==='done'\n    };\n\n    if (V.testRunning){\n      const t = S.test, cur = t.list[t.i], src = byId[cur.id] || {q:'', a:'', code:''};\n      const targetSec = (parseInt(cur.target,10)||1)*60;\n      const left = targetSec - Math.floor((Date.now()-t.start)/1000);\n      Object.assign(V, {\n        tProgress: 'Question '+(t.i+1)+' of '+t.list.length,\n        tPct: ((t.i)/t.list.length*100).toFixed(2)+'%',\n        tId: cur.id, tTarget: cur.target, tTask: cur.task,\n        tClock: this.clock(left), tOnTime: left>=0, tOver: left<0,\n        tQHtml: html(src.q), tAHtml: html(src.a),\n        tHasAnswer: !!src.a, tNoAnswer: !src.a, tHasCode: !!src.code, tCode: src.code,\n        tRevealed: !!t.revealed,\n        onReveal: () => this.setState(s=>({test:Object.assign({}, s.test, {revealed:true})})),\n        onPass: () => this.mark(true),\n        onFail: () => this.mark(false)\n      });\n    }\n    if (V.testDone){\n      const marks = S.test.marks, score = marks.filter(m=>m.pass).length;\n      const band = score>=22\n        ? ['22+ clean = ready.','var(--green-wash)','var(--green)']\n        : score>=15\n        ? ['15–21 = drill the misses for a week.','var(--amber-wash)','var(--amber)']\n        : [\"Under 15 = you're preparing for the wrong interview stage; go back to fundamentals before doing mocks.\",'var(--red-wash)','var(--red)'];\n      const misses = marks.filter(m=>!m.pass);\n      Object.assign(V, {\n        tScore: score, tVerdictHtml: html(band[0]), tVerdictWash: band[1], tVerdictInk: band[2],\n        tMisses: misses, tHasMisses: misses.length>0\n      });\n    }\n    return V;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
